<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador de Ciclos de Born-Haber · Profesor Iván PB-IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #F2F6F3;
  --surface: #FFFFFF;
  --surface-alt: #E8F1EC;
  --ink: #223333;
  --ink-soft: #5B6E6C;
  --ink-faint: #8A9C9A;
  --primary: #4C8A80;
  --primary-dark: #2F5F58;
  --primary-pale: #DCEAE5;
  --accent: #CD9A54;
  --accent-dark: #A97A3B;
  --accent-pale: #F3E5C9;
  --metal: #5E7FB0;
  --metal-pale: #E1E9F5;
  --nonmetal: #B96E7C;
  --nonmetal-pale: #F5E2E5;
  --danger: #C8695D;
  --danger-pale: #F6E2DF;
  --success: #5C9276;
  --success-pale: #E1EEE5;
  --border: #D9E4DF;
  --shadow: 0 8px 24px -12px rgba(34,51,51,0.18);
  --radius: 16px;
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', 'Courier New', monospace;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}

/* ---------- decorative lattice backdrop ---------- */
.lattice-bg{
  position:fixed; inset:0; z-index:-1; pointer-events:none;
  background-image:
    radial-gradient(circle at 1px 1px, rgba(76,138,128,0.10) 1.4px, transparent 1.4px);
  background-size: 34px 34px;
}

/* ---------- layout shell ---------- */
.shell{max-width:960px; margin:0 auto; padding:28px 20px 80px;}

header.top{
  display:flex; align-items:flex-start; justify-content:space-between; gap:20px;
  margin-bottom:28px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:14px;}
.brand-mark{
  width:46px; height:46px; flex:none; position:relative;
}
.brand-mark svg{width:100%; height:100%;}
.brand h1{
  font-family:var(--font-display); font-weight:600; font-size:1.5rem; margin:0;
  color:var(--primary-dark); letter-spacing:-0.01em;
}
.brand p{margin:2px 0 0; font-size:0.86rem; color:var(--ink-soft);}

.steps-nav{display:flex; gap:8px; align-items:center;}
.step-pill{
  display:flex; align-items:center; gap:6px;
  font-size:0.74rem; font-weight:600; color:var(--ink-faint);
  padding:6px 12px 6px 8px; border-radius:999px; background:var(--surface);
  border:1px solid var(--border);
}
.step-pill .num{
  width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--border); color:var(--surface); font-size:0.72rem; font-family:var(--font-mono);
}
.step-pill.active{color:var(--primary-dark); border-color:var(--primary);}
.step-pill.active .num{background:var(--primary); color:#fff;}
.step-pill.done .num{background:var(--success); color:#fff;}
.step-pill.done{color:var(--success);}

/* ---------- cards ---------- */
.card{
  background:var(--surface); border-radius:var(--radius); border:1px solid var(--border);
  box-shadow:var(--shadow); padding:28px;
}

/* ---------- intro / info ---------- */
.intro{margin-bottom:24px;}
.intro p{color:var(--ink-soft); max-width:70ch; font-size:0.98rem;}
details.concepts{
  margin-top:14px; background:var(--surface-alt); border-radius:12px; padding:4px 18px;
  border:1px solid var(--border);
}
details.concepts summary{cursor:pointer; font-weight:600; padding:12px 0; color:var(--primary-dark); font-size:0.92rem;}
.concepts-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; padding-bottom:16px;}
.concept-item{font-size:0.86rem; color:var(--ink-soft);}
.concept-item b{color:var(--ink); display:block; font-size:0.86rem; margin-bottom:2px;}

/* ---------- library grid ---------- */
.lib-grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; margin-top:20px;
}
.compound-card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:20px; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  display:flex; flex-direction:column; gap:10px; text-align:left;
}
.compound-card:hover{transform:translateY(-3px); box-shadow:var(--shadow); border-color:var(--primary);}
.compound-card:focus-visible{outline:3px solid var(--primary); outline-offset:2px;}
.cc-top{display:flex; justify-content:space-between; align-items:flex-start;}
.cc-formula{font-family:var(--font-display); font-size:1.6rem; font-weight:600; color:var(--primary-dark);}
.diff-badge{
  font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
  padding:4px 9px; border-radius:999px;
}
.diff-facil{background:var(--success-pale); color:var(--success);}
.diff-medio{background:var(--accent-pale); color:var(--accent-dark);}
.diff-dificil{background:var(--danger-pale); color:var(--danger);}
.cc-name{font-size:0.9rem; color:var(--ink-soft);}
.cc-ions{display:flex; gap:6px; font-family:var(--font-mono); font-size:0.72rem;}
.ion-chip{padding:3px 8px; border-radius:6px;}
.ion-chip.metal{background:var(--metal-pale); color:var(--metal);}
.ion-chip.nonmetal{background:var(--nonmetal-pale); color:var(--nonmetal);}
.cc-cta{margin-top:auto; font-size:0.82rem; font-weight:600; color:var(--primary); display:flex; align-items:center; gap:4px;}

/* ---------- workspace header inside a compound flow ---------- */
.work-head{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
.work-title{display:flex; align-items:baseline; gap:10px;}
.work-title h2{font-family:var(--font-display); font-size:1.7rem; margin:0; color:var(--ink);}
.work-title span{font-size:0.85rem; color:var(--ink-soft);}
.link-btn{
  background:none; border:none; color:var(--primary-dark); font-weight:600; font-size:0.85rem;
  cursor:pointer; display:flex; align-items:center; gap:5px; padding:6px 0;
}
.link-btn:hover{text-decoration:underline;}

/* ---------- equation balancing ---------- */
.equation-row{
  display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
  background:var(--surface-alt); border-radius:14px; padding:30px 20px; margin:18px 0;
  font-family:var(--font-mono); font-size:1.25rem;
}
.coef-input{
  width:64px; height:48px; text-align:center; font-family:var(--font-mono); font-size:1.05rem; font-weight:600;
  border:2px solid var(--border); border-radius:10px; background:#fff; color:var(--primary-dark);
}
.coef-input:focus{outline:none; border-color:var(--primary);}
.species{padding:8px 6px; font-weight:600;}
.species.metal-sp{color:var(--metal);}
.species.nonmetal-sp{color:var(--nonmetal);}
.species.product-sp{color:var(--primary-dark);}
.op{color:var(--ink-faint); font-size:1.3rem;}
.state-tag{font-size:0.65rem; vertical-align:sub; color:var(--ink-faint);}

.action-row{display:flex; gap:10px; align-items:center; margin-top:16px; flex-wrap:wrap;}
.btn{
  font-family:var(--font-body); font-weight:600; font-size:0.92rem; border-radius:10px;
  padding:11px 22px; border:none; cursor:pointer; transition:filter .15s ease, transform .1s ease;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--primary); color:#fff;}
.btn-primary:hover{filter:brightness(1.06);}
.btn-primary:disabled{background:var(--border); color:var(--ink-faint); cursor:not-allowed;}
.btn-ghost{background:transparent; color:var(--primary-dark); border:1.5px solid var(--primary);}
.btn-ghost:hover{background:var(--primary-pale);}

.feedback{
  margin-top:14px; padding:12px 16px; border-radius:10px; font-size:0.9rem; font-weight:500;
  display:none;
}
.feedback.show{display:block;}
.feedback.ok{background:var(--success-pale); color:var(--success);}
.feedback.bad{background:var(--danger-pale); color:var(--danger);}

/* ---------- born-haber cycle diagram ---------- */
.cycle-wrap{margin:20px 0 8px;}
.cycle-top{
  display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap;
  padding:18px; background:var(--surface-alt); border-radius:14px 14px 0 0; text-align:center;
}
.cycle-node{
  font-family:var(--font-mono); font-weight:600; font-size:0.95rem; color:var(--ink);
  background:#fff; border:1.5px solid var(--border); border-radius:10px; padding:10px 16px;
}
.cycle-arrow-label{font-size:0.78rem; color:var(--primary-dark); font-weight:600;}
.cycle-arrow{font-size:1.4rem; color:var(--primary); }
.direct-path{display:flex; flex-direction:column; align-items:center; gap:2px;}

.slots-panel{
  border:1.5px dashed var(--border); border-top:none; border-radius:0 0 14px 14px;
  padding:22px; background:#fff;
}
.slot-row{
  display:grid; grid-template-columns:28px minmax(180px,1fr) 92px 110px 128px 30px; gap:10px; align-items:center;
  padding:10px 8px; border-bottom:1px solid var(--border);
}
.slot-row:last-child{border-bottom:none;}
.slot-index{
  width:26px; height:26px; border-radius:50%; background:var(--primary-pale); color:var(--primary-dark);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:0.75rem; font-weight:700;
}
.slot-select{
  width:100%; padding:9px 10px; border-radius:8px; border:1.5px solid var(--border);
  font-family:var(--font-body); font-size:0.85rem; background:#fff; color:var(--ink);
}
.slot-select:focus{outline:none; border-color:var(--primary);}
.slot-mult{display:flex; align-items:center; gap:6px; font-size:0.78rem; color:var(--ink-soft);}
.slot-mult input{
  width:68px; padding:8px 6px; text-align:center; border-radius:8px; border:1.5px solid var(--border);
  font-family:var(--font-mono); font-size:0.85rem;
}
.slot-mult input:focus{outline:none; border-color:var(--primary);}
.slot-status{font-size:1.1rem; text-align:center;}
.slot-status.ok{color:var(--success);}
.slot-status.bad{color:var(--danger);}
.slot-status.idle{color:var(--ink-faint); font-size:0.9rem;}

/* ---------- step 3 numeric ---------- */
.calc-table{width:100%; border-collapse:collapse; margin:18px 0; font-size:0.9rem;}
.calc-table th{
  text-align:left; font-size:0.72rem; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint);
  padding:8px 10px; border-bottom:2px solid var(--border);
}
.calc-table td{padding:11px 10px; border-bottom:1px solid var(--border); font-family:var(--font-mono);}
.calc-table td.label-cell{font-family:var(--font-body); color:var(--ink);}
.calc-table tr.unknown-row td{background:var(--accent-pale); font-weight:700;}
.calc-table tr.unknown-row td.label-cell{color:var(--accent-dark);}
.mult-tag{
  font-family:var(--font-mono); font-size:0.78rem; background:var(--surface-alt); color:var(--primary-dark);
  padding:2px 7px; border-radius:6px; margin-left:6px;
}

.answer-row{display:flex; align-items:center; gap:12px; margin:18px 0; flex-wrap:wrap;}
.answer-row label{font-weight:600; font-size:0.92rem;}
.answer-input{
  font-family:var(--font-mono); font-size:1.1rem; padding:11px 14px; border-radius:10px;
  border:2px solid var(--border); width:160px;
}
.answer-input:focus{outline:none; border-color:var(--primary);}
.unit-tag{color:var(--ink-soft); font-size:0.88rem;}

.explain-box{
  margin-top:16px; background:var(--surface-alt); border-radius:12px; padding:16px 18px;
  font-size:0.87rem; color:var(--ink-soft); display:none;
}
.explain-box.show{display:block;}
.explain-box .formula{font-family:var(--font-mono); color:var(--primary-dark); font-weight:600; display:block; margin:8px 0; font-size:0.92rem;}

/* ---------- result screen ---------- */
.result-hero{text-align:center; padding:30px 10px 10px;}
.result-hero .big-check{font-size:3rem; margin-bottom:8px;}
.result-hero h2{font-family:var(--font-display); font-size:1.8rem; margin:0 0 6px; color:var(--primary-dark);}
.result-hero p{color:var(--ink-soft); max-width:52ch; margin:0 auto;}
.result-actions{display:flex; gap:12px; justify-content:center; margin-top:24px; flex-wrap:wrap;}

/* ---------- footer ---------- */
footer.credit{
  text-align:center; margin-top:48px; padding-top:20px; border-top:1px solid var(--border);
  color:var(--ink-faint); font-size:0.82rem; letter-spacing:.01em;
}
footer.credit strong{color:var(--ink-soft); font-weight:600;}

@media (max-width:640px){
  .shell{padding:20px 14px 60px;}
  .steps-nav{width:100%; justify-content:space-between;}
  .step-pill span.label{display:none;}
  .slot-row{grid-template-columns:22px 1fr; row-gap:8px;}
  .slot-val, .slot-mult, .slot-status{grid-column:2 / -1; justify-self:start;}
  .equation-row{font-size:1rem; padding:22px 12px;}
  .coef-input{width:56px; height:44px; font-size:0.92rem;}
}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;}
}

.notice{background:var(--accent-pale);border:1px solid #e7cfa0;border-radius:12px;padding:14px 16px;font-size:.88rem;color:#6d4c1d;margin-top:14px}
.notice b{color:#5a3d12}
.notice .sign-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;font-family:var(--font-mono);font-size:.82rem}
.notice .sign-row div{background:#fff;border-radius:8px;padding:8px 10px}
.quick-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.quick-btn{background:var(--metal-pale);color:var(--metal);border:1px solid #c6d4ea;border-radius:10px;padding:10px 14px;font-weight:600;font-size:.85rem;cursor:pointer;font-family:var(--font-body)}
.quick-btn:hover{filter:brightness(.97)}
.section-label{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:700;margin:22px 0 4px}
.ion-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:18px 0}
.ion-box{background:var(--surface-alt);border-radius:14px;padding:16px 18px}
.ion-box .el{font-family:var(--font-display);font-size:1.5rem;font-weight:600}
.ion-box .el.metal-sp{color:var(--metal)} .ion-box .el.nonmetal-sp{color:var(--nonmetal)}
.ion-box label{display:block;font-size:.84rem;color:var(--ink-soft);margin:6px 0}
.ion-box input{width:110px}
.slot-eq{grid-column:2 / -1;font-family:var(--font-mono);font-size:.8rem;color:var(--primary-dark);background:var(--primary-pale);border-radius:6px;padding:4px 8px;display:none;justify-self:start}
.slot-eq.show{display:inline-block}
.eq-cell{font-family:var(--font-mono);font-size:.78rem;color:var(--ink-soft);display:block;margin-top:3px}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 4px}
.toolbar select{padding:8px 10px;border-radius:8px;border:1.5px solid var(--border);font-family:var(--font-body);font-size:.85rem;background:#fff;max-width:100%}
.custom-panel{border:1.5px dashed var(--metal);border-radius:12px;padding:14px 16px;margin:12px 0;background:var(--metal-pale);display:none}
.custom-panel.show{display:block}
.custom-row{display:grid;grid-template-columns:1fr 110px 70px;gap:8px;align-items:center;padding:5px 0;font-size:.84rem}
.custom-row input[type=text]{padding:7px;border-radius:7px;border:1.5px solid var(--border);font-family:var(--font-mono);font-size:.84rem;width:100%}
.custom-row .rad{font-size:.75rem;color:var(--ink-soft);display:flex;align-items:center;gap:4px}
.diagram-wrap{background:#fff;border:1px solid var(--border);border-radius:14px;padding:10px;margin:18px 0;overflow-x:auto}
.diagram-wrap svg{display:block;min-width:620px;width:100%;height:auto}
.diagram-legend{display:flex;gap:16px;font-size:.78rem;color:var(--ink-soft);padding:4px 8px 2px;flex-wrap:wrap}
.diagram-legend span::before{content:'';display:inline-block;width:12px;height:3px;margin-right:6px;vertical-align:middle;background:currentColor}
.lg-endo{color:var(--danger)} .lg-exo{color:var(--success)} .lg-unk{color:var(--accent-dark)}
.think{margin-top:24px;text-align:left;background:var(--surface-alt);border-radius:14px;padding:18px 20px}
.think h3{margin:0 0 8px;font-family:var(--font-display);color:var(--primary-dark);font-size:1.15rem}
.think p{margin:0 0 10px;color:var(--ink)}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;margin:7px 0;font-family:var(--font-body);font-size:.9rem;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--primary)}
.opt.ok{border-color:var(--success);background:var(--success-pale)}
.opt.bad{border-color:var(--danger);background:var(--danger-pale)}
.data-note{font-size:.78rem;color:var(--ink-faint);margin-top:10px}
@media (max-width:640px){.mob-hint{display:inline!important}.custom-row{grid-template-columns:1fr 90px}.custom-row .rad{grid-column:1/-1}.notice .sign-row{grid-template-columns:1fr}}
.slot-val{font-family:var(--font-mono);font-size:.85rem;font-weight:600;color:var(--primary-dark);background:var(--primary-pale);border-radius:8px;padding:8px 6px;text-align:center}
.slot-val.na{font-family:var(--font-body);font-weight:500;font-size:.7rem;color:var(--ink-faint);background:var(--surface-alt)}
.prod-input{width:84px;padding:8px 6px;text-align:center;border-radius:8px;border:1.5px solid var(--border);font-family:var(--font-mono);font-size:.85rem}
.data-panel{margin-top:14px;border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--surface-alt)}
.dp-title{font-weight:700;font-size:.88rem;margin-bottom:8px}
.dp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px 14px}
.dp-item{display:flex;justify-content:space-between;gap:8px;font-size:.84rem;border-bottom:1px dashed var(--border);padding:3px 0}
.dp-item b{font-family:var(--font-mono)}
.timeline{margin:18px 0 6px}
.tl-title{font-size:.82rem;color:var(--ink-soft);font-weight:600;margin-bottom:8px}
.tl-row{display:flex;align-items:center;gap:10px 6px;flex-wrap:wrap}
.tl-item{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:120px}
.tl-eq{font-family:var(--font-mono);font-size:.7rem;color:var(--ink-soft);text-align:center;max-width:150px;min-height:2.4em;display:flex;align-items:flex-end;justify-content:center}
.tl-box{border-radius:9px;padding:9px 10px;color:#fff;font-weight:700;font-size:.8rem;text-align:center;width:100%;box-sizing:border-box}
.tl-box.endo{background:#B71C1C}.tl-box.exo{background:#1B5E20}.tl-box.unk{background:var(--accent-dark)}.tl-box.sum{background:#E8F0E8;color:#1B5E20;border:1.5px solid #1B5E20}
.tl-val{font-family:var(--font-mono);font-size:.78rem;font-weight:700}
.tl-val.endo{color:#B71C1C}.tl-val.exo{color:#1B5E20}.tl-val.unk{color:var(--accent-dark)}.tl-val.sum{color:#1B5E20}
.tl-arrow{color:var(--ink-faint);font-weight:700}
.own-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0}
.own-grid label{display:flex;flex-direction:column;gap:6px;font-size:.85rem;font-weight:600}
.own-grid select{padding:9px;border-radius:8px;border:1.5px solid var(--border);font-size:.9rem}
.own-card{border-style:dashed}
@media (max-width:640px){.own-grid{grid-template-columns:1fr}}
.brandbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 2px 4px;font-size:14px}
.brand-pill{display:flex;align-items:center;gap:12px;padding:7px 20px 7px 7px;border-radius:999px;background:var(--surface);border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04);font-weight:600;color:var(--ink)}
.brand-pill>span:last-child{white-space:nowrap}
@media (max-width:640px){.brand-pill{font-size:13px;padding-right:14px}}
.brand-ico{width:40px;height:40px;border-radius:50%;background:var(--primary-dark);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.brandbar a{color:var(--accent-dark);font-weight:600;text-decoration:none}
.brandbar a:hover{text-decoration:underline}
.credit.credit-right{text-align:right !important}
.credit-right p{margin:0}
</style>
</head>
<body>
<div class="lattice-bg"></div>

function label(c,k){

/* ---------- utilidades ---------- */
function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstElementChild;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickN(a,n){return shuffle(a).slice(0,n);}
function parseFrac(s){
  if(s==null)return NaN; s=String(s).trim(); if(s==='')return NaN;
  if(s.includes('/')){const p=s.split('/');if(p.length!==2)return NaN;const n=parseFloat(p[0]),d=parseFloat(p[1]);return (isNaN(n)||isNaN(d)||d===0)?NaN:n/d;}
  return parseFloat(s.replace(',','.'));
}
function parseNum(s){ if(s==null)return NaN; s=String(s).trim().replace(/\s/g,'').replace('−','-').replace(',','.'); return s===''?NaN:Number(s); }
function fracLabel(v){
  if(v==null||isNaN(v))return '';
  if(Math.abs(v-Math.round(v))<0.001)return String(Math.round(v));
  for(const [n,l] of [[0.5,'1/2'],[1.5,'3/2'],[0.25,'1/4'],[0.75,'3/4']]) if(Math.abs(v-n)<0.001) return l;
  return String(Math.round(v*100)/100);
}
function fracsMatch(a,b){return !isNaN(a)&&!isNaN(b)&&Math.abs(a-b)<=0.01;}
function round1(n){return Math.round(n*10)/10;}
function sgn(v){return (v>0?'+':'')+v;}
/* Carga de un ion: acepta "+2", "2+", "2", "-1", "1-", "+", "-" */
function parseCharge(s){
  s=String(s||'').trim().replace(/\s/g,'').replace('−','-');
  if(s==='+')return 1; if(s==='-')return -1;
  let m=s.match(/^([+-])?(\d+)$/); if(m) return (m[1]==='-'?-1:1)*parseInt(m[2]);
  m=s.match(/^(\d+)([+-])$/); if(m) return (m[2]==='-'?-1:1)*parseInt(m[1]);
  return NaN;
}

    <div class="action-row"><button class="btn btn-primary" id="chk">Comprobar</button>
      <button class="btn btn-ghost" id="next" style="display:none">Continuar al ajuste →</button></div>
    <div class="feedback" id="fb"></div></div>`;
  bindBack();
  document.getElementById('chk').addEventListener('click',()=>{
    const qc=parseCharge(document.getElementById('qc').value), qa=parseCharge(document.getElementById('qa').value);

      fb.className='feedback show ok';
      fb.innerHTML=`Correcto: <b>${cat(c)}</b> y <b>${an(c)}</b>. Para que el compuesto sea neutro, la fórmula es <b>${c.fh}</b>${c.nA>1?` (dos ${an(c)} por cada ${cat(c)})`:''}.`;

      if(!okA) m.push(`Revisa el anión: los no metales del grupo 17 ganan 1 e⁻ y los del grupo 16 ganan 2 e⁻ (carga negativa).`);
      fb.innerHTML=m.join('<br>');
    }
  });
  document.getElementById('next').addEventListener('click',renderStep2);
}

/* =========================================================

/* =========================================================
   PASO 3 · ESQUEMA DEL CICLO
   ========================================================= */
function renderStep3(){
  state.step=3; renderStepsNav();
  const c=state.c, S=state.slots, U=state.unknown;
  const valOf=j=>U===j?'?':sgn(S[j].value);
  const pool=shuffle(S.map((s,j)=>({v:'s'+j,l:label(c,s.key)})).concat(pickN(DISTRACTOR_POOL,3).map((l,k)=>({v:'d'+k,l}))));
  const rows=S.map((_,i)=>`<div class="slot-row">
      <div class="slot-index">${i+1}</div>
      <select class="slot-select" data-idx="${i}"><option value="">Selecciona la energía…</option>${pool.map(o=>`<option value="${o.v}">${o.l}</option>`).join('')}</select>
      <div class="slot-val" id="val-${i}" title="Valor del dato (kJ/mol)">—</div>
      <div class="slot-mult">× <input class="mult-input" data-idx="${i}" placeholder="½, 1, 2…" aria-label="Multiplicador"></div>
      <div class="slot-mult">= <input class="prod-input" data-idx="${i}" placeholder="kJ/mol" aria-label="Valor multiplicado"></div>
      <div class="slot-status idle" id="st-${i}">&nbsp;</div>
      <div class="slot-eq" id="eq-${i}"></div></div>`).join('');
  const data=shuffle(S.map((s,j)=>({l:label(c,s.key),v:valOf(j)})));
  data.push({l:`Entalpía de formación del ${c.fh}`,v:U==='form'?'?':sgn(state.form)});
  document.getElementById('app').innerHTML=`<div class="card">${head('Paso 3 de 4')}
    <p style="color:var(--ink-soft);font-size:.92rem">El camino directo es la entalpía de formación de 1 mol de compuesto. Completa el <b>camino indirecto</b>: elige cada energía (en cualquier orden, sin repetir); al elegirla verás su valor. Después escribe <b>por cuánto hay que multiplicarla</b> y el <b>valor ya multiplicado</b>. Si el dato es la incógnita (?), deja vacío el valor multiplicado.</p>
    <div class="cycle-wrap">
      <div class="cycle-top">
        <div class="cycle-node">${elems(c)}</div>
        <div class="direct-path"><span class="cycle-arrow-label">ΔH°<sub>f</sub></span><span class="cycle-arrow">→</span></div>
        <div class="cycle-node">${c.fh}(s)</div>
      </div>
      <div class="slots-panel">${rows}</div>
    </div>
    <div class="data-panel"><div class="dp-title">📋 Datos del problema (kJ/mol)</div>
      <div class="dp-grid">${data.map(d=>`<div class="dp-item"><span>${d.l}</span><b>${d.v}</b></div>`).join('')}</div>
      <p class="data-note" style="margin-top:6px">La disociación se da por mol de ${x2(c)}; la afinidad electrónica y la ionización, por átomo o ion.</p></div>
    <details class="concepts" style="margin-top:14px"><summary>¿Por cuánto multiplico? Mira la fórmula</summary>
      <div style="padding:10px 4px;font-size:.88rem;line-height:1.55">Escribe la reacción de formación de 1 mol de compuesto: <b>${elems(c)} → ${c.fh}(s)</b>.<br>
      • El coeficiente del ${x2(c)} multiplica a la <b>disociación</b> (× ½ si hay un átomo de ${c.X} en la fórmula; × 1 si hay dos).<br>
      • Se suma <b>una afinidad por cada átomo</b> de no metal de la fórmula.<br>
      • La <b>carga del catión</b> dice cuántas ionizaciones hay (I₁, I₁ + I₂…) y la <b>carga del anión</b>, cuántas afinidades sucesivas.<br>
      • Si hay más de un átomo de metal en la fórmula, su sublimación e ionizaciones se multiplican por ese número.</div></details>
    <div class="action-row"><button class="btn btn-primary" id="chk">Comprobar esquema</button>
      <button class="btn btn-ghost" id="next" style="display:none">Continuar al cálculo →</button></div>
    <div class="feedback" id="fb"></div></div>`;
  bindBack();
  document.querySelectorAll('.slot-select').forEach(sel=>sel.addEventListener('change',()=>{
    const i=sel.dataset.idx, v=sel.value, box=document.getElementById('val-'+i);
    box.textContent = /^s\d+$/.test(v) ? valOf(+v.slice(1)) : (v?'no es un dato del ciclo':'—');
    box.classList.toggle('na', !!v && !/^s\d+$/.test(v));
  }));
  document.getElementById('chk').addEventListener('click',()=>{
    const used={}; S.forEach((_,i)=>{const v=document.querySelector(`.slot-select[data-idx="${i}"]`).value;used[v]=(used[v]||0)+1;});
    let all=true, prodBad=false, multBad=false;
    S.forEach((_,i)=>{
      const v=document.querySelector(`.slot-select[data-idx="${i}"]`).value;
      const mult=parseFrac(document.querySelector(`.mult-input[data-idx="${i}"]`).value.replace('½','1/2'));
      const prodRaw=document.querySelector(`.prod-input[data-idx="${i}"]`).value.trim();
      const st=document.getElementById('st-'+i), eq=document.getElementById('eq-'+i);
      const typeOk=/^s\d+$/.test(v)&&used[v]===1;
      const j=typeOk?+v.slice(1):-1, slot=typeOk?S[j]:null;
      const mOk=typeOk&&fracsMatch(mult,slot.multiplier);
      let pOk=true;
      if(typeOk&&j!==U){const pv=parseNum(prodRaw); pOk=!isNaN(pv)&&Math.abs(pv-slot.value*slot.multiplier)<=1;}
      if(typeOk&&j===U) pOk=(prodRaw===''||prodRaw==='?');
      const ok=mOk&&pOk;
      if(typeOk&&!mOk)multBad=true; if(mOk&&!pOk)prodBad=true;
      st.className='slot-status '+(ok?'ok':'bad'); st.innerHTML=ok?'✓':'✗';
      if(typeOk){eq.textContent=(slot.multiplier!==1?multTxt(slot.multiplier)+' × ':'')+'['+equation(c,slot.key)+']';eq.classList.add('show');}
      else eq.classList.remove('show');
      if(!ok)all=false;
    });
    const fb=document.getElementById('fb');
    if(all){fb.className='feedback show ok';fb.innerHTML='Esquema correcto: has identificado todas las etapas, por cuánto se multiplica cada una y su valor multiplicado.';document.getElementById('next').style.display='inline-block';}
    else{fb.className='feedback show bad';
      let m=['Algunas filas no son correctas (✗).'];
      m.push('Revisa que cada energía sea del ciclo y no esté repetida.');
      if(multBad) m.push('Algún multiplicador no es correcto: abre «¿Por cuánto multiplico? Mira la fórmula».');
      if(prodBad) m.push('Algún valor multiplicado no cuadra: multiplica el dato por su coeficiente y respeta el signo.');
      fb.innerHTML=m.join(' ');}
  });
  document.getElementById('next').addEventListener('click',()=>renderStep4(true));
}
/* =========================================================
   LÍNEA DE TIEMPO DEL CICLO
   ========================================================= */
function timelineHTML(c,S,form,U){
  const items=S.map((s,i)=>{
    const unk=U===i, v=s.value*s.multiplier, cls=unk?'unk':(v>0?'endo':'exo');
    const calc=unk?'?':(s.multiplier!==1?`${multTxt(s.multiplier)} · (${sgn(s.value)}) = ${sgn(round1(v))}`:sgn(s.value));
    return `<div class="tl-item"><div class="tl-eq">${s.multiplier!==1?multTxt(s.multiplier)+' × ':''}${equation(c,s.key)}</div>
      <div class="tl-box ${cls}">${TL[s.key]}${s.multiplier!==1?` (× ${multTxt(s.multiplier)})`:''}</div>
      <div class="tl-val ${cls}">${calc}</div></div>`;}).join('<div class="tl-arrow">→</div>');
  return `<div class="timeline"><div class="tl-title">Línea de tiempo del ciclo: arriba lo que ocurre, abajo su valor ya multiplicado (kJ/mol)</div>
    <div class="tl-row">${items}<div class="tl-arrow">=</div><div class="tl-item"><div class="tl-eq">${elems(c)} → ${c.fh}(s)</div><div class="tl-box sum">Σ = ΔH°f</div><div class="tl-val sum">${U==='form'?'?':sgn(form)}</div></div></div></div>`;
}
/* =========================================================
   DIAGRAMA DE NIVELES DE ENERGÍA
   ========================================================= */
function diagramSVG(c,slots,form,unknown){
  // valores efectivos (la incógnita se calcula para dibujar el ciclo cerrado)
  const vals=slots.map(s=>s.value*s.multiplier);
  if(unknown!=null&&unknown!=='form'){
    const others=vals.reduce((a,v,i)=>i===unknown?a:a+v,0); vals[unknown]=form-others;
  }
  const fVal = unknown==='form' ? vals.reduce((a,v)=>a+v,0) : form;
  const levels=[0]; vals.forEach(v=>levels.push(levels[levels.length-1]+v));
  const all=levels.concat([fVal]); const max=Math.max(...all), min=Math.min(...all);
  const H=380, top=40, X0=240, DX=92, W=X0+slots.length*DX+70;
  const y=h=>top+(max-h)/((max-min)||1)*H;
  let g='';
  const col={endo:'#C8695D',exo:'#5C9276',unk:'#A97A3B',ink:'#223333',soft:'#8A9C9A'};
  // nivel cero y formación
  g+=`<line x1="20" y1="${y(0)}" x2="${W-10}" y2="${y(0)}" stroke="${col.soft}" stroke-dasharray="3 4" stroke-width="1"/>`;
  g+=`<text x="22" y="${y(0)-8}" font-size="12" fill="${col.ink}" font-family="Inter,sans-serif">Elementos: ${elems(c)}</text>`;
  const fUnk=unknown==='form';
  const fc=fUnk?col.unk:(fVal<0?col.exo:col.endo);
  g+=`<line x1="${W-40}" y1="${y(fVal)}" x2="${W-10}" y2="${y(fVal)}" stroke="${col.ink}" stroke-width="3"/>`;
  g+=`<line x1="60" y1="${y(0)}" x2="60" y2="${y(fVal)-(fVal<0?8:-8)}" stroke="${fc}" stroke-width="3" marker-end="url(#ah-${fUnk?'u':(fVal<0?'x':'n')})"/>`;
  g+=`<text x="66" y="${(y(0)+y(fVal))/2+18}" font-size="12" font-weight="700" fill="${fc}" font-family="Inter,sans-serif">ΔH°f = ${fUnk?'?':sgn(form)}</text>`;
  g+=`<line x1="60" y1="${y(fVal)}" x2="${W-40}" y2="${y(fVal)}" stroke="${col.soft}" stroke-dasharray="3 4"/>`;
  g+=`<text x="${W-42}" y="${y(fVal)+16}" font-size="12" text-anchor="end" fill="${col.ink}" font-family="Inter,sans-serif">${c.fh}(s)</text>`;
  slots.forEach((s,i)=>{
    const x0=X0+i*DX, y1=y(levels[i]), y2=y(levels[i+1]), short=Math.abs(y2-y1)<34;
    const isU=unknown===i, up=vals[i]>0;
    const cc=isU?col.unk:(up?col.endo:col.exo);
    g+=`<line x1="${x0-26}" y1="${y1}" x2="${x0+26}" y2="${y1}" stroke="${col.ink}" stroke-width="2.5"/>`;
    g+=`<line x1="${x0}" y1="${y1}" x2="${x0}" y2="${y2+(up?8:-8)}" stroke="${cc}" stroke-width="3" marker-end="url(#ah-${isU?'u':(up?'n':'x')})"/>`;
    const lab=(s.multiplier!==1?fracLabel(s.multiplier)+'·':'')+SHORT[s.key]+(s.key==='ea1'&&s.multiplier===2?'':'' );
    const val=isU?'?':sgn(s.value);
    if(short){
      g+=`<text x="${x0-24}" y="${Math.min(y1,y2)-(up?14:8)}" font-size="11.5" font-weight="700" fill="${cc}" font-family="Inter,sans-serif">${lab} <tspan font-family="JetBrains Mono,monospace" font-weight="400">${val}</tspan></text>`;
    }else{
      g+=`<text x="${x0+6}" y="${(y1+y2)/2-2}" font-size="12" font-weight="700" fill="${cc}" font-family="Inter,sans-serif">${lab}</text>`;
      g+=`<text x="${x0+6}" y="${(y1+y2)/2+12}" font-size="11" fill="${cc}" font-family="JetBrains Mono,monospace">${val}</text>`;
    }
    g+=`<title>${label(c,s.key)}: ${equation(c,s.key)}</title>`;
  });
  const last=slots.length, xl=X0+last*DX;
  g+=`<line x1="${xl-26}" y1="${y(levels[last])}" x2="${Math.min(xl+10,W-10)}" y2="${y(levels[last])}" stroke="${col.ink}" stroke-width="2.5"/>`;
  const defs=`<defs>${[['n',col.endo],['x',col.exo],['u',col.unk]].map(([k,cl])=>`<marker id="ah-${k}" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${cl}"/></marker>`).join('')}</defs>`;
  return `<div class="diagram-wrap"><svg viewBox="0 0 ${W} ${H+top*2}" role="img" aria-label="Diagrama de niveles de energía del ciclo de Born-Haber">${defs}${g}</svg>
    <div class="diagram-legend"><span class="lg-endo">Endotérmico (sube)</span><span class="lg-exo">Exotérmico (baja)</span><span class="lg-unk">Incógnita</span><span>Escala aproximada · kJ/mol</span><span style="display:none" class="mob-hint">← desliza →</span></div></div>`;
}

/* =========================================================
   PASO 4 · CÁLCULO (ley de Hess)
   ========================================================= */
function chooseUnknown(){
  const S=state.slots, m=state.unknownMode;
  if(m==='random'){const r=Math.floor(Math.random()*(S.length+1));return r===S.length?'form':r;}
  if(m==='form')return 'form';
  const idx=S.findIndex(s=>s.key===m); return idx>=0?idx:'form';
}
function renderStep4(keepUnknown){
  state.step=4; renderStepsNav();
  const c=state.c, S=state.slots;
  if(!keepUnknown) state.unknown=chooseUnknown();
  state.tries=0;
  const U=state.unknown;
  const opts=[['random','Aleatoria']].concat(S.map(s=>[s.key,label(c,s.key)])).concat([['form','Entalpía de formación']]);
  const rows=S.map((s,i)=>`<tr class="${U===i?'unknown-row':''}"><td class="label-cell">${label(c,s.key)}<span class="mult-tag">×${multTxt(s.multiplier)}</span><span class="eq-cell">${equation(c,s.key)}</span></td>
     <td>${U===i?'?':sgn(s.value)+' kJ/mol'}</td></tr>`).join('')+
    `<tr class="${U==='form'?'unknown-row':''}"><td class="label-cell">Entalpía de formación del ${c.fh}<span class="eq-cell">${elems(c)} → ${c.fh}(s)</span></td>
     <td>${U==='form'?'?':sgn(state.form)+' kJ/mol'}</td></tr>`;
  const customRows=S.map((s,i)=>`<div class="custom-row"><span>${label(c,s.key)} <span class="mult-tag">×${fracLabel(s.multiplier)}</span></span>
     <input type="text" data-cv="${i}" value="${s.value}"><label class="rad"><input type="radio" name="cu" value="${i}" ${U===i?'checked':''}> incógnita</label></div>`).join('')+
    `<div class="custom-row"><span>Entalpía de formación</span><input type="text" data-cv="form" value="${state.form}"><label class="rad"><input type="radio" name="cu" value="form" ${U==='form'?'checked':''}> incógnita</label></div>`;
  document.getElementById('app').innerHTML=`<div class="card">${head('Paso 4 de 4')}
    <p style="color:var(--ink-soft);font-size:.92rem">Ley de Hess: la suma de las energías del camino indirecto (cada una multiplicada por su coeficiente) es igual a la entalpía de formación. Calcula el valor marcado con <b>?</b>.</p>
    <div class="toolbar" ${c.custom?'style="display:none"':''}>
      <label for="um" style="font-size:.85rem;font-weight:600">Incógnita:</label>
      <select id="um">${opts.map(([v,l])=>`<option value="${v}" ${state.unknownMode===v?'selected':''}>${l}</option>`).join('')}</select>
      <button class="btn btn-ghost" id="customBtn" style="padding:8px 14px">✏️ Usar datos de mi ejercicio</button>
    </div>
    <div class="custom-panel" id="customPanel">
      <p style="margin:0 0 8px;font-size:.85rem;color:var(--ink-soft)">Escribe los datos de tu enunciado (kJ/mol, con signo) y marca cuál es la incógnita. El valor de la incógnita se ignora.</p>
      ${customRows}
      <div class="action-row"><button class="btn btn-primary" id="applyCustom">Usar estos datos</button><button class="btn btn-ghost" id="resetData">Restaurar datos del simulador</button></div>
      <div class="feedback" id="fbc"></div>
    </div>
    ${timelineHTML(c,S,state.form,U)}
    ${diagramSVG(c,S,state.form,U)}
    <table class="calc-table"><thead><tr><th>Etapa</th><th>Valor</th></tr></thead><tbody>${rows}</tbody></table>
    ${U!=='form'&&S[U].key==='ret'?`<p class="data-note">Recuerda: en el ciclo, E<sub>r</sub> corresponde a la formación del cristal desde los iones gaseosos.</p>`:''}
    <div class="answer-row"><label for="ans">Tu respuesta:</label><input type="text" inputmode="decimal" class="answer-input" id="ans" placeholder="0"><span class="unit-tag">kJ/mol</span>
      <button class="btn btn-primary" id="chk">Comprobar</button></div>
    <div class="feedback" id="fb"></div><div class="explain-box" id="box"></div>
    <div class="action-row" style="margin-top:22px"><button class="btn btn-ghost" id="next" style="display:none">Ver resumen y pregunta final →</button></div>
    <p class="data-note">Datos didácticos de la Unidad 3. Pueden diferir unos kJ/mol de otras tablas según la fuente.</p></div>`;
  bindBack();
  document.getElementById('um').addEventListener('change',e=>{state.unknownMode=e.target.value;renderStep4();});
  document.getElementById('customBtn').addEventListener('click',()=>document.getElementById('customPanel').classList.toggle('show'));
  document.getElementById('resetData').addEventListener('click',()=>{state.slots=slotsOf(c);state.form=c.form;renderStep4(true);});
  document.getElementById('applyCustom').addEventListener('click',()=>{
    const r=document.querySelector('input[name="cu"]:checked'), fbc=document.getElementById('fbc');
    if(!r){fbc.className='feedback show bad';fbc.innerHTML='Marca cuál es la incógnita.';return;}
    const u=r.value==='form'?'form':+r.value;
    const ns=S.map(s=>({...s})); let nf=state.form, bad=false;
    document.querySelectorAll('[data-cv]').forEach(inp=>{
      const k=inp.dataset.cv; const isU=(k==='form'&&u==='form')||(k!=='form'&&+k===u); if(isU)return;
      const v=parseNum(inp.value); if(isNaN(v)){bad=true;return;}
      if(k==='form')nf=v; else ns[+k].value=v;
    });
    if(bad){fbc.className='feedback show bad';fbc.innerHTML='Hay algún dato vacío o no numérico (solo la incógnita puede quedar sin valor).';return;}
    state.slots=ns; state.form=nf; state.unknown=u; renderStep4(true);
  });
  document.getElementById('chk').addEventListener('click',checkStep4);
  document.getElementById('next').addEventListener('click',renderResult);
}

function checkStep4(){
  const c=state.c,S=state.slots,U=state.unknown;
  const v=parseNum(document.getElementById('ans').value);
  const fb=document.getElementById('fb'), box=document.getElementById('box');
  if(isNaN(v)){fb.className='feedback show bad';fb.innerHTML='Escribe un valor numérico.';return;}
  let correct, dev;
  const term=s=>`(${sgn(s.value)})·${fracLabel(s.multiplier)}`;
  if(U==='form'){
    correct=S.reduce((a,s)=>a+s.value*s.multiplier,0);
    dev=`ΔH°f = ${S.map(term).join(' + ')} = <b>${round1(correct)} kJ/mol</b>`;
  }else{
    const s=S[U], others=S.reduce((a,x,i)=>i===U?a:a+x.value*x.multiplier,0), cx=state.form-others;
    correct=cx/s.multiplier;
    dev=`${fracLabel(s.multiplier)}·X = ΔH°f − (suma del resto) = ${state.form} − (${round1(others)}) = ${round1(cx)}<br>X = ${round1(cx)} / ${fracLabel(s.multiplier)} = <b>${round1(correct)} kJ/mol</b>`;
  }
  const tol=Math.max(3,Math.abs(correct)*0.01);
  state.tries++;
  if(Math.abs(v-correct)<=tol){
    fb.className='feedback show ok'; fb.innerHTML=`¡Correcto! El valor es ${round1(correct)} kJ/mol.`;
    box.className='explain-box show'; box.innerHTML=`<b>Desarrollo:</b><span class="formula">${dev}</span>`;
    document.getElementById('next').style.display='inline-block'; return;
  }
  fb.className='feedback show bad';
  if(Math.abs(v+correct)<=tol && Math.abs(correct)>1){
    fb.innerHTML=`Tienes el valor numérico, pero <b>el signo es incorrecto</b>. ${U!=='form'&&S[U].key==='ret'?'Has usado el convenio de ruptura de la red (+). En el ciclo, la energía reticular corresponde a la formación del cristal y es negativa.':'Revisa si el proceso es endotérmico (+) o exotérmico (−).'}`;
    return;
  }
  if(state.tries<2){
    fb.innerHTML='Todavía no coincide. Comprueba: ¿has multiplicado cada energía por su coeficiente? ¿Has respetado los signos (endotérmico +, exotérmico −)? Inténtalo de nuevo.';
    box.className='explain-box show'; box.innerHTML='<b>Pista:</b> plantea Σ(coeficiente × energía del camino indirecto) = ΔH°f y despeja la incógnita. Mira el diagrama: la suma de las flechas de colores debe llegar al mismo nivel que ΔH°f.';
    return;
  }
  fb.innerHTML=`Todavía no coincide. El valor correcto es ${round1(correct)} kJ/mol. Revisa el desarrollo.`;
  box.className='explain-box show'; box.innerHTML=`<b>Desarrollo:</b><span class="formula">${dev}</span>Recuerda que el ciclo se cierra: la suma del camino indirecto es igual a la entalpía de formación (ley de Hess).`;
}

/* =========================================================
   RESUMEN + PREGUNTA DE RAZONAMIENTO
   ========================================================= */
function renderResult(){
  const c=state.c, t=THINK[c.id];
  const order=t?shuffle(t.o.map((o,i)=>({o,i}))):[];
  document.getElementById('app').innerHTML=`<div class="card result-hero"><div class="big-check">🌟</div>
    <h2>Ciclo de ${c.fh} completado</h2>
    <p>Has identificado los iones, ajustado la reacción de formación, construido el ciclo de Born–Haber y calculado una de sus energías para el ${c.custom?c.fh:c.name.toLowerCase()}.</p>
    ${t?`<div class="think"><h3>🧠 Para pensar</h3><p>${t.q}</p>
      ${order.map(x=>`<button class="opt" data-i="${x.i}">${x.o}</button>`).join('')}
      <div class="feedback" id="fbt"></div></div>`:''}
    <div class="result-actions"><button class="btn btn-ghost" id="retry">Repetir este compuesto</button><button class="btn btn-primary" id="lib">Elegir otro compuesto</button></div></div>`;
  document.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    const fb=document.getElementById('fbt'), ok=+b.dataset.i===t.c;
    document.querySelectorAll('.opt').forEach(x=>x.classList.remove('bad'));
    b.classList.add(ok?'ok':'bad');
    fb.className='feedback show '+(ok?'ok':'bad');
    fb.innerHTML=ok?`<b>Correcto.</b> ${t.e}`:'No es esa. Piensa en la carga y el tamaño de los iones, y vuelve a intentarlo.';
  }));
  document.getElementById('retry').addEventListener('click',()=>c.custom?renderCustomForm():startCompound(c.id));
  document.getElementById('lib').addEventListener('click',renderLibrary);
  renderStepsNav(true);
}

/* =========================================================
   COMPUESTO PROPIO
   ========================================================= */
const NONMETALS={F:{st:'g',za:1},Cl:{st:'g',za:1},Br:{st:'l',za:1},I:{st:'s',za:1},O:{st:'g',za:2}};
function gcd(a,b){return b?gcd(b,a%b):a;}
function subNum(n){return n>1?String(n).split('').map(d=>'₀₁₂₃₄₅₆₇₈₉'[d]).join(''):'';}
function customKeys(zc,X){const za=NONMETALS[X].za;
  const k=['sub', NONMETALS[X].st==='g'?'dis':'atom']; for(let i=1;i<=zc;i++)k.push('ion'+i);
  k.push('ea1'); if(za===2)k.push('ea2'); k.push('ret'); return k;}
function renderCustomForm(){
  state={c:null}; renderStepsNav();
  document.getElementById('app').innerHTML=`<div class="card"><div class="work-head"><div class="work-title"><h2>Tu propio compuesto</h2><span>Elige los iones y escribe los datos de tu enunciado</span></div>
    <button class="link-btn" data-back>← Biblioteca</button></div>
    <div class="own-grid">
      <label>Símbolo del metal<input id="om" class="answer-input" placeholder="ej: K" maxlength="2"></label>
      <label>Carga del catión<select id="oc"><option value="1">1+</option><option value="2">2+</option><option value="3">3+</option></select></label>
      <label>No metal<select id="ox">${Object.keys(NONMETALS).map(x=>`<option>${x}</option>`).join('')}</select></label>
    </div>
    <p class="data-note" id="ofml"></p>
    <div id="odata"></div>
    <p class="data-note">Escribe los datos en kJ/mol con su signo, tal como vienen en el enunciado (la disociación, por mol de X₂; ionizaciones y afinidades, por átomo). <b>Deja vacía solo la incógnita.</b></p>
    <div class="action-row"><button class="btn btn-primary" id="ogo">Construir el ciclo →</button></div>
    <div class="feedback" id="ofb"></div></div>`;
  bindBack();
  const draw=()=>{
    const M=(document.getElementById('om').value.trim()||'M'), zc=+document.getElementById('oc').value, X=document.getElementById('ox').value;
    const za=NONMETALS[X].za, g=gcd(zc,za), a=za/g, b=zc/g;
    const fake={M,X,zc,za,nA:b,nC:a,fh:M+subNum(a)+X+subNum(b),xState:NONMETALS[X].st};
    document.getElementById('ofml').innerHTML=`Fórmula: <b>${fake.fh}</b> · iones ${M}${SUP[zc]} y ${X}${SUPN[za]}`;
    const sig=zc+X, od=document.getElementById('odata');
    if(od.dataset.sig===sig){ od.querySelectorAll('[data-ok]').forEach(inp=>{const k=inp.dataset.ok; inp.previousElementSibling.textContent=k==='form'?'Entalpía de formación del '+fake.fh:label(fake,k);}); return; }
    od.dataset.sig=sig;
    const prev={}; document.querySelectorAll('[data-ok]').forEach(i=>prev[i.dataset.ok]=i.value);
    od.innerHTML=customKeys(zc,X).concat(['form']).map(k=>`<div class="custom-row" style="grid-template-columns:1fr 130px"><span>${k==='form'?'Entalpía de formación del '+fake.fh:label(fake,k)}</span><input type="text" data-ok="${k}" value="${prev[k]||''}" placeholder="kJ/mol"></div>`).join('');
  };
  ['om','oc','ox'].forEach(id=>{const e=document.getElementById(id);e.addEventListener('input',draw);e.addEventListener('change',draw);}); draw();
  document.getElementById('ogo').addEventListener('click',()=>{
    const fb=document.getElementById('ofb');
    const M=document.getElementById('om').value.trim(), zc=+document.getElementById('oc').value, X=document.getElementById('ox').value;
    if(!/^[A-Z][a-z]?$/.test(M)){fb.className='feedback show bad';fb.innerHTML='Escribe el símbolo del metal (por ejemplo K, Ba o Al).';return;}
    const za=NONMETALS[X].za, g=gcd(zc,za), a=za/g, b=zc/g;
    const keys=customKeys(zc,X); let blanks=[], vals={}, bad=false;
    keys.concat(['form']).forEach(k=>{const r=document.querySelector(`[data-ok="${k}"]`).value.trim(); if(r===''||r==='?'){blanks.push(k);return;} const v=parseNum(r); if(isNaN(v))bad=true; vals[k]=v;});
    if(bad){fb.className='feedback show bad';fb.innerHTML='Hay algún dato que no es un número.';return;}
    if(blanks.length!==1){fb.className='feedback show bad';fb.innerHTML=`Deja vacía <b>exactamente una</b> casilla: la incógnita (ahora hay ${blanks.length}).`;return;}
    const mult=k=>(k==='sub'||k.startsWith('ion'))?a:(k==='dis'||k==='atom')?b/2:k.startsWith('ea')?b:1;
    const slots=keys.map(k=>[k,k===blanks[0]?NaN:vals[k],mult(k)]);
    const c={id:'custom',custom:true,f:M+X,fh:M+subNum(a)+X+subNum(b),name:'Tu compuesto',M,X,zc,za,nA:b,nC:a,xState:NONMETALS[X].st,
      coefs:{metal:a,nonmetal:b/2},slots,form:blanks[0]==='form'?NaN:vals.form,customUnknown:blanks[0]==='form'?'form':keys.indexOf(blanks[0])};
    startCompound(c);
  });
}
renderLibrary();
</script>
